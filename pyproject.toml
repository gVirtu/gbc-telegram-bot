[project]
name = "pokemon-telegram-bot"
version = "0.1.0"
description = "Telegram bot for playing Pokemon Red via crowdsourced input"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
lru_cache_disabled = '''
    src.config
    '''