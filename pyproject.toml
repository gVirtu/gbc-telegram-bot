[project]
name = "gbc-telegram-bot"
version = "2.7.0"
description = "Telegram/Discord bot for playing GBC games via crowdsourced input"
requires-python = ">=3.11"

dependencies = [
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-telegram-bot==20.7",
    "pyboy@git+https://github.com/gVirtu/PyBoy",
    "Pillow==11.3.0",
    "numpy==1.26.3",
    "python-dotenv==1.0.0",
    "discord.py==2.7.1",
    "av>=14.0.0",
]

[dependency-groups]
dev = [
    "pytest (>7.0.0,<8)",
    "pytest-cov (>=4.0.0)",
    "pytest-asyncio (==0.23.4)",
    "pytest-antilru (==2.0.0)",
    "httpx (==0.25.2)",
    "vulture (==2.14)",
    "coverage (==7.13.3)",
    "ruff (>=0.15.0,<0.16.0)",
    "coverage-badge",
    "snakeviz",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
asyncio_mode = "auto"
lru_cache_disabled = '''
    src.config
    '''
    
[tool.poetry]
package-mode = false
